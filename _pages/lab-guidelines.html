<!--
  The text of these pages is encrypted in assets/json/lab-guidelines.enc.json.
  Edit the plaintext in lab-guidelines-src/ (gitignored) and re-run
  bin/encrypt-lab-guidelines.rb; see the comment at the top of that script.
-->
<div id="lab-lock">
  <form id="lab-lock-form" autocomplete="off">
    <label for="lab-pw">Password</label>
    <input type="password" id="lab-pw" autocomplete="current-password" required>
    <button type="submit">Unlock</button>
  </form>
  <p id="lab-lock-msg" class="lab-lock-msg" aria-live="polite"></p>
  <p>If you're in the lab and don't have the password, <a href="mailto:smgroves@virginia.edu">email me</a>.</p>
</div>

<div id="lab-content" hidden>
  <nav id="lab-tabs" class="lab-tabs" aria-label="Lab Guidelines pages"></nav>
  <div id="lab-page"></div>
</div>

<script>
(function () {
  var SRC = "{{ '/assets/json/lab-guidelines.enc.json' | relative_url }}";
  var KEY = "lab-guidelines-pw";
  var pages = null;
  var form = document.getElementById("lab-lock-form");
  var msg = document.getElementById("lab-lock-msg");

  function b64(s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }

  async function decrypt(pw) {
    var enc = await (await fetch(SRC, { cache: "no-cache" })).json();
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    var key = await crypto.subtle.deriveKey(
      { name: "PBKDF2", hash: "SHA-256", salt: b64(enc.salt), iterations: enc.iterations },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(enc.iv) }, key, b64(enc.data));
    return JSON.parse(new TextDecoder().decode(plain)).pages;
  }

  function render() {
    if (!pages) return;
    var id = location.hash.slice(1);
    var page = pages.find(function (p) { return p.id === id; }) || pages[0];
    document.getElementById("lab-tabs").innerHTML = pages.map(function (p) {
      return '<a href="#' + p.id + '"' + (p === page ? ' aria-current="page"' : "") + ">" + p.title + "</a>";
    }).join("");
    document.getElementById("lab-page").innerHTML = "<h2>" + page.title + "</h2>" + page.html;
    document.title = page.title + " | Lab Guidelines";
  }

  async function unlock(pw, remembered) {
    msg.textContent = remembered ? "" : "Unlocking…";
    try {
      pages = await decrypt(pw);
    } catch (e) {
      pages = null;
      try { sessionStorage.removeItem(KEY); } catch (_) {}
      msg.textContent = remembered ? "" : "That password didn't work.";
      return;
    }
    try { sessionStorage.setItem(KEY, pw); } catch (_) {}
    document.getElementById("lab-lock").hidden = true;
    document.getElementById("lab-content").hidden = false;
    render();
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    unlock(document.getElementById("lab-pw").value, false);
  });
  window.addEventListener("hashchange", function () { render(); window.scrollTo(0, 0); });

  var saved = null;
  try { saved = sessionStorage.getItem(KEY); } catch (_) {}
  if (saved) unlock(saved, true);
})();
</script>
