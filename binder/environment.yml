# Binder environment for jupyter/elevation.ipynb (Python geospatial).
# A binder/ folder takes priority over the root environment.yml, which is the Pluto/Julia setup.
name: elevation
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - scipy
  - matplotlib
  - ipympl          # %matplotlib widget
  - ipywidgets
  - rasterio
  - geopandas
  - shapely
  - affine
  - contextily
  - osmnx
  - networkx
