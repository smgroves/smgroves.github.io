name: deploy Pluto notebooks to Cloud Run

# Builds the PlutoSliderServer image, checks that it serves the notebooks, and
# deploys it to Google Cloud Run. One-time Google Cloud setup: cloud-run/SETUP.md.
# Needs repository variables GCP_PROJECT, GCP_WIF_PROVIDER and GCP_SERVICE_ACCOUNT;
# until they are set, the workflow only builds and tests the image.
on:
  push:
    branches:
      - master
    paths:
      - 'julia/**.jl'
      - 'cloud-run/Dockerfile'
      - 'pluto-deployment-environment/**'
      - '.github/workflows/pluto-cloud-run.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  REGION: us-east4
  SERVICE: pluto-notebooks
  IMAGE: us-east4-docker.pkg.dev/${{ vars.GCP_PROJECT }}/pluto/pluto-notebooks:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Assemble build context
      run: |
        mkdir -p build/notebooks
        cp cloud-run/Dockerfile build/
        cp -r pluto-deployment-environment build/
        cp julia/*.jl build/notebooks/
        # interactive.jl is a test notebook not listed on /notebooks/; each running
        # notebook takes ~0.6 GB, so leave it out
        rm build/notebooks/interactive.jl
    - name: Build image
      run: docker build -t pluto build
    - name: Check the server starts and runs the notebooks
      run: |
        docker run -d --name pluto --memory 4g -p 8080:8080 pluto
        for nb in Runge_Kutta Ordinary_Differential_Equations; do
          for i in $(seq 1 60); do
            curl -sf -o /dev/null "http://localhost:8080/$nb.html" && echo "$nb ready" && break
            sleep 5
          done
          curl -sf -o /dev/null "http://localhost:8080/$nb.html" || { docker logs pluto; exit 1; }
        done
        docker logs pluto 2>&1 | tail -20
        docker stop pluto
    - name: Authenticate to Google Cloud
      if: vars.GCP_PROJECT != ''
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
        service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
    - name: Set up gcloud
      if: vars.GCP_PROJECT != ''
      uses: google-github-actions/setup-gcloud@v2
    - name: Push image and deploy
      if: vars.GCP_PROJECT != ''
      run: |
        gcloud auth configure-docker $REGION-docker.pkg.dev --quiet
        docker tag pluto "$IMAGE"
        docker push "$IMAGE"
        gcloud run deploy $SERVICE --image "$IMAGE" --region $REGION \
          --service-account pluto-runtime@${{ vars.GCP_PROJECT }}.iam.gserviceaccount.com \
          --allow-unauthenticated --memory 4Gi --cpu 1 --cpu-boost \
          --min-instances 0 --max-instances 1 --timeout 300 --quiet
        gcloud run services describe $SERVICE --region $REGION --format 'value(status.url)'
